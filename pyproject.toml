[project]
name = "federated-governance"
version = "0.1.0"
description = "Federated Data Governance Reference Implementation"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "snowflake-connector-python>=3.6",
    "databricks-sdk>=0.20",
    "trino>=0.328",
    "psycopg2-binary>=2.9",
    "pyarrow>=15.0",
    "adbc-driver-flightsql>=0.10",
    "adbc-driver-postgresql>=0.10",
    "adbc-driver-snowflake>=0.10",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "faker>=22.0",
    "polars>=0.20",
    "pyiceberg[s3]>=0.7",
    "pyspark>=3.5,<3.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "mypy>=1.8",
    "ruff>=0.2",
    "nbstripout>=0.7",
    "types-requests>=2.31",
]
demo = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.1",
    "plotly>=5.18",
    "itables>=2.0",
    "nbformat>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "positive: Positive use case tests (UC-1 through UC-11)",
    "negative: Negative scenario tests (NEG-1 through NEG-10)",
    "arrow: Arrow governance comparison tests",
    "performance: Performance benchmark tests",
    "spectrum: Spectrum proof point tests",
    "infrastructure: Tests requiring live infrastructure (skip when unconfigured)",
    "spark: Tests requiring PySpark and Gravitino Spark connector",
    "iceberg: Tests requiring Iceberg cold tier data",
    "model_catalog: Tests for Gravitino model catalog (Bedrock)",
    "cross_format: Cross-format federation query tests",
    "enforcement: Ranger enforcement verification tests (UC-11)",
    "unit: Unit tests that run without infrastructure",
    "regulatory: Regulatory compliance verification tests (BCBS239, DORA, GDPR, EU AI Act, SOX, SR11-7)",
    "validation: Validation proof-point tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
