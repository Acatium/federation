# Databricks Unity Catalog via Iceberg REST + credential vending (Trino 479)
#
# This is the ACCESS pattern: UC validates permissions and vends scoped STS
# credentials. The safety property is preserved because UC ACLs remain the
# enforcement backstop — Trino never gets unscoped S3 credentials.
#
# Prerequisites on Databricks side:
#   1. Enable UniForm on target tables:
#      ALTER TABLE <catalog>.federation_demo.risk_signals
#        SET TBLPROPERTIES ('delta.universalFormat.enabledFormats' = 'iceberg')
#   2. Grant EXTERNAL USE SCHEMA to the PAT principal
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:DATABRICKS_HOST}/api/2.1/unity-catalog/iceberg-rest
iceberg.rest-catalog.warehouse=${ENV:DATABRICKS_CATALOG}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${ENV:DATABRICKS_TOKEN}
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.region=${ENV:AWS_REGION}
