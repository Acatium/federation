# Gravitino connector — discovers catalogs registered in the federation metalake
# and dynamically creates Trino catalogs for supported types (Hive, Iceberg, MySQL, PostgreSQL).
#
# Catalog routing:
#   - Hive/Iceberg (hive, iceberg_s3): routable via Gravitino (lakehouse-iceberg + GlueCatalog)
#   - Databricks: registered via lakehouse-iceberg + REST backend (UC Iceberg REST with auth)
#   - Snowflake: registered via lakehouse-iceberg + REST backend (Open Catalog / Polaris IRC)
#     LIMITATION: Gravitino has no native Snowflake JDBC catalog provider (supported: MySQL,
#     PostgreSQL, Doris, OceanBase, StarRocks only). Snowflake Open Catalog (managed Polaris)
#     exposes tables via Iceberg REST protocol as the discovery path. Query execution uses
#     Trino's native Snowflake connector directly.
#   - Redshift: routable via Gravitino (jdbc-postgresql provider)
#
# See deploy/trino-config/ for standalone connector configs used by Trino directly.
connector.name=gravitino
gravitino.metalake=federation
gravitino.uri=http://gravitino:8090
