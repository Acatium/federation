# Trino Redshift connector — direct connection (Trino 479 built-in)
# Provides UNLOAD-based parallel reads, Redshift-specific type mappings,
# and Redshift-specific predicate pushdown.
connector.name=redshift
connection-url=jdbc:redshift://${ENV:REDSHIFT_HOST}:${ENV:REDSHIFT_PORT}/${ENV:REDSHIFT_DATABASE}
connection-user=${ENV:REDSHIFT_USER}
connection-password=${ENV:REDSHIFT_PASSWORD}

# Metadata caching (reduces catalog round-trips for repeated queries)
metadata.cache-ttl=1m
metadata.cache-maximum-size=10000
