# Trino 479 configuration for federation stack
# Direct catalog connectors (redshift, snowflake, hive, iceberg) + built-in Ranger plugin
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memory limits (single-node, 32GB host, ~20GB JVM heap)
query.max-memory=10GB
query.max-memory-per-node=10GB

# Spill to disk (essential for cross-catalog joins on limited memory)
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
spill-compression-codec=LZ4
max-spill-per-node=20GB

# Query limits
query.max-cpu-time=30m
